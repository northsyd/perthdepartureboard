<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 304 191">

  <defs>

    <style>

      .blue {
        fill: #002237;
      }

      .yellow {
        fill: #f2b843;
      }

      .black-text {
        fill: #221f20;
        font-family: Overpass-ExtraBold, Overpass, sans-serif;
        font-weight: 700;
      }

      .white-bold {
        fill: #fff;
        font-family: Overpass-Bold, Overpass, sans-serif;
        font-weight: 700;
      }

      .white-semi {
        fill: #fff;
        font-family: Overpass-SemiBold, Overpass, sans-serif;
        font-weight: 600;
      }

      .header {
        font-size: 11px;
      }

      .large {
        font-size: 20px;
      }

      .medium {
        font-size: 17px;
      }

      .small-large {
        font-size: 15px;
      }

      .line {
        fill: none;
        stroke: #fff;
        stroke-miterlimit: 10;
        stroke-width: .5px;
      }

    </style>

  </defs>


  <!-- TOP BAR -->

  <rect id="topBar"
        class="yellow"
        width="304"
        height="30"/>


  <!-- MAIN BLUE AREA -->

  <rect class="blue"
        y="30"
        width="304"
        height="161"/>


  <!-- HEADER -->

  <text class="black-text header"
        transform="translate(10.41 20.65)">
    Platform
  </text>

  <text id="platform"
        class="black-text header"
        transform="translate(72 20.65)">
    5
  </text>

  <text class="black-text header"
        transform="translate(186.41 20.65)">
    Mins
  </text>

  <text class="black-text header"
        transform="translate(219.42 20.65)">
    Pattern
  </text>

  <text class="black-text header"
        transform="translate(268.41 20.65)">
    Cars
  </text>


  <!-- FIRST SERVICE -->

  <text id="destination"
        class="white-bold large"
        transform="translate(10.41 55.65)">
    Cockburn Central
  </text>

  <text id="mins"
        class="white-bold large"
        transform="translate(190.42 55.65)">
    12
  </text>

  <text id="pattern"
        class="white-bold large"
        transform="translate(225.42 55.65)">
    TP
  </text>

  <text id="cars"
        class="white-bold large"
        transform="translate(270.42 55.65)">
    6
  </text>


  <line class="line"
        x1="297.98"
        y1="66.56"
        x2="6.44"
        y2="66.56"/>


  <!-- STOPS LABEL -->

  <text class="white-bold medium"
        transform="translate(11.72 88.43)">
