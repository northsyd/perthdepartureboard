    <tspan x="24.34"
           y="20.4">
      at:
    </tspan>
  </text>


  <!-- EDITABLE STOPS -->

  <text id="stops"
        class="white-semi"
        font-size="11px"
        transform="translate(66.17 79.36)">
  </text>


  <line class="line"
        x1="297.98"
        y1="126.56"
        x2="6.44"
        y2="126.56"/>


  <!-- SECOND SERVICE -->

  <text class="white-bold header"
        transform="translate(11.74 141.44)">
