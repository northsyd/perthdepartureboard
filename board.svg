  </text>


  <text class="white-bold header"
        transform="translate(190.76 141.44)">
    Mins
  </text>

  <text id="secondMins"
        class="white-bold small-large"
        transform="translate(194.18 158)">
    27
  </text>


  <text class="white-bold header"
        transform="translate(223.04 141.44)">
    Pattern
  </text>

  <text id="secondPattern"
        class="white-bold small-large"
        transform="translate(233 157.99)">
    TP
  </text>


  <line class="line"
        x1="297.98"
        y1="165.56"
        x2="6.44"
        y2="165.56"/>


