<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 304 191">

  <defs>
    <style>
      .blue {
        fill: #002237;
      }

      .yellow {
        fill: #f2b843;
      }

      .black {
        fill: #221f20;
        font-family: Overpass, Arial, sans-serif;
        font-weight: 700;
      }

      .white {
        fill: #fff;
        font-family: Overpass, Arial, sans-serif;
        font-weight: 700;
      }

      .semi {
        fill: #fff;
        font-family: Overpass, Arial, sans-serif;
        font-weight: 600;
      }

      .line {
        fill: none;
        stroke: #fff;
        stroke-width: 0.5;
      }
    </style>
  </defs>


  <!-- TOP COLOUR BAR -->

  <rect
    id="topBar"
    class="yellow"
    x="0"
    y="0"
    width="304"
    height="30"
  />


  <!-- MAIN BOARD -->

  <rect
    class="blue"
    x="0"
    y="30"
    width="304"
    height="161"
  />


  <!-- HEADER -->

  <text
    class="black"
    font-size="11"
    x="10.41"
    y="20.65"
  >Platform</text>

  <text
    id="platform"
    class="black"
    font-size="11"
    x="72"
    y="20.65"
  >5</text>

  <text
    class="black"
    font-size="11"
    x="186.41"
    y="20.65"
  >Mins</text>

  <text
    class="black"
    font-size="11"
    x="219.42"
    y="20.65"
  >Pattern</text>

  <text
    class="black"
    font-size="11"
    x="268.41"
    y="20.65"
  >Cars</text>


  <!-- FIRST SERVICE -->

  <text
    id="destination"
    class="white"
    font-size="20"
    x="10.41"
    y="55.65"
  >Cockburn Central</text>

  <text
    id="mins"
    class="white"
    font-size="20"
    x="190.42"
    y="55.65"
  >12</text>

  <text
    id="pattern"
    class="white"
    font-size="20"
    x="225.42"
    y="55.65"
  >TP</text>

  <text
    id="cars"
    class="white"
    font-size="20"
    x="270.42"
    y="55.65"
  >6</text>


  <!-- SEPARATOR -->

  <line
    class="line"
    x1="297.98"
    y1="66.56"
    x2="6.44"
    y2="66.56"
  />


  <!-- STOPS LABEL -->

  <text
    class="white"
    font-size="17"
    x="11.72"
    y="88.43"
  >Stops</text>

  <text
    class="white"
    font-size="17"
    x="35"
    y="108.83"
  >at:</text>


  <!-- EDITABLE STOPS -->

  <text
    id="stops"
    class="semi"
    font-size="11"
    x="66.17"
    y="79.36"
  ></text>


  <!-- SEPARATOR -->

  <line
    class="line"
    x1="297.98"
    y1="126.56"
    x2="6.44"
    y2="126.56"
  />


  <!-- SECOND SERVICE -->

  <text
    class="white"
    font-size="11"
    x="11.74"
    y="141.44"
  >Then:</text>

  <text
    id="then"
    class="white"
    font-size="15"
    x="11.72"
    y="157.99"
  >Cockburn Central</text>


  <text
    class="white"
    font-size="11"
    x="190.76"
    y="141.44"
  >Mins</text>

  <text
    id="secondMins"
    class="white"
    font-size="15"
    x="194.18"
    y="158"
  >27</text>


  <text
    class="white"
    font-size="11"
    x="223.04"
    y="141.44"
  >Pattern</text>

  <text
    id="secondPattern"
    class="white"
    font-size="15"
    x="233"
    y="157.99"
  >TP</text>


  <!-- SEPARATOR -->

  <line
    class="line"
    x1="297.98"
    y1="165.56"
    x2="6.44"
    y2="165.56"
  />


  <!-- TIME -->

  <text
    id="time"
    class="white"
    font-size="15"
    text-anchor="end"
    x="293"
    y="182.55"
  >5:28 pm</text>

</svg>
